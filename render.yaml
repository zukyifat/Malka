services:
  - type: web
    name: malka-family-tree
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "משפחת מלכה"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: "sqlite"
      - key: DB_DATABASE
        value: "/var/www/html/database/database.sqlite"
      - key: SESSION_DRIVER
        value: "file"
      - key: CACHE_DRIVER
        value: "file"
      - key: FILESYSTEM_DISK
        value: "public"
